# Website-Informationen
title: GeoStat
description: Dokumentation des Projekts "Geostatistische Grundlagenbildung ko-kreativ".
avatar: /assets/img/avatar.png # Optional: Pfad zu einem Profilbild

# Design / Theme-Auswahl (Wählen Sie eines dieser offiziellen GitHub-Themes)
# Optionen: jekyll-theme-cayman, jekyll-theme-architect, jekyll-theme-minimal, jekyll-theme-merlot, jekyll-theme-slate
theme: jekyll-theme-minimal

# Plugins für zusätzliche Funktionen
plugins:
  - jekyll-seo-tag # Optimiert automatisch Titel, Meta-Tags und Suchmaschinen-Vorschauen

# Dateien und Ordner, die GitHub beim Erstellen der Website ignorieren soll
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md # Verhindert Dopplungen, falls Sie bereits eine index.md nutzen

# Logos
footer_logos:
  - name: "Freie Universität Berlin"
    image: "/img/fu-logo.png"
    url: "https://www.fu-berlin.de/"
